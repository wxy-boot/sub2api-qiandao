services:
  sub2api-qiandao:
    # 直接用 GitHub Actions 构建好的镜像（公开包，无需 docker login）。
    # 想固定版本可改成 ghcr.io/wxy-boot/sub2api-qiandao:sha-<提交号>。
    # 想本地构建则改用：docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/wxy-boot/sub2api-qiandao:latest
    container_name: sub2api-qiandao
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # QQ 机器人（AstrBot 插件）共享密钥；写在 .env 里即可，compose 会一并读取。
      BOT_SHARED_SECRET: ${BOT_SHARED_SECRET:-}
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
